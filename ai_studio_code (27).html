<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ホライゾン風レーシングゲーム 設計書</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0f17;
      color: #e2e8f0;
      font-family: 'Hiragino Sans', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
    code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    h1, h2, h3, h4, p, ul, ol { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    table { border-collapse: collapse; width: 100%; }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(11, 15, 23, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-inner {
      max-width: 72rem;
      margin: 0 auto;
      padding: 0 1rem;
      height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 0.875rem;
    }
    @media (min-width: 768px) { .brand { font-size: 1rem; } }
    .brand-bar {
      display: inline-block;
      width: 0.5rem;
      height: 1.25rem;
      background: #f97316;
      transform: skewX(-12deg);
    }
    .btn-primary {
      font-size: 0.75rem;
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      background: #f97316;
      color: #000;
      font-weight: 600;
      transition: background 0.15s;
    }
    @media (min-width: 768px) { .btn-primary { font-size: 0.875rem; } }
    .btn-primary:hover { background: #fb923c; }
    .btn-lg {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 700;
      font-size: 1rem;
    }

    /* Mobile Nav */
    .mobile-nav {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      white-space: nowrap;
      padding: 0 1rem 0.5rem;
    }
    .mobile-pill {
      font-size: 0.75rem;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
    }
    .mobile-pill.active {
      background: #f97316;
      color: #000;
      border-color: #f97316;
    }

    /* Layout */
    .container {
      max-width: 72rem;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      gap: 2.5rem;
    }
    .sidebar { display: none; width: 11rem; flex-shrink: 0; }
    .sidebar-sticky {
      position: sticky;
      top: 5rem;
      padding: 2.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .side-link {
      display: block;
      font-size: 0.875rem;
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      border-left: 2px solid transparent;
      color: #94a3b8;
      transition: color 0.15s, background 0.15s;
    }
    .side-link:hover { color: #fff; }
    .side-link.active {
      border-left-color: #f97316;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    @media (min-width: 1024px) {
      .mobile-nav { display: none; }
      .sidebar { display: block; }
    }
    main { flex: 1; min-width: 0; padding-bottom: 6rem; }

    /* Sections */
    .section {
      scroll-margin-top: 5rem;
      padding: 2.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .hero { padding-top: 3rem; }
    .sec-head {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .sec-no { font-size: 0.875rem; color: #fb923c; }
    .sec-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    @media (min-width: 768px) { .sec-title { font-size: 1.875rem; } }

    .hero-tag {
      color: #fb923c;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
    }
    .hero-h1 {
      font-size: 1.875rem;
      font-weight: 800;
      line-height: 1.25;
    }
    @media (min-width: 768px) { .hero-h1 { font-size: 3rem; } }
    .grad-text {
      color: transparent;
      background: linear-gradient(to right, #fb923c, #f43f5e);
      -webkit-background-clip: text;
      background-clip: text;
    }
    .lead {
      margin-top: 1.25rem;
      color: #cbd5e1;
      line-height: 1.625;
      max-width: 48rem;
    }
    .lead b { color: #fff; }

    /* Cards & Grids */
    .card {
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1.25rem;
    }
    .card-title { font-weight: 600; margin-bottom: 0.75rem; color: #fff; }
    .kpi-grid {
      margin-top: 2rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }
    @media (min-width: 768px) { .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .kpi-card {
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem;
    }
    .kpi-label { font-size: 0.75rem; color: #94a3b8; }
    .kpi-val { font-size: 1.5rem; font-weight: 800; margin-top: 0.25rem; }
    @media (min-width: 768px) { .kpi-val { font-size: 1.875rem; } }
    .kpi-sub { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }

    .grid-2 { display: grid; gap: 0.75rem; }
    @media (min-width: 768px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .grid-sm-2 { display: grid; gap: 0.5rem; }
    @media (min-width: 640px) { .grid-sm-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .grid-arch { display: grid; gap: 1rem; }
    @media (min-width: 1024px) {
      .grid-arch { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .col-span-3 { grid-column: span 3 / span 3; }
      .col-span-2 { grid-column: span 2 / span 2; }
    }

    /* Callouts */
    .callout {
      margin-top: 1.5rem;
      border-radius: 0.75rem;
      padding: 1rem;
      font-size: 0.875rem;
      line-height: 1.625;
    }
    .callout-orange {
      border: 1px solid rgba(249, 115, 22, 0.3);
      background: rgba(249, 115, 22, 0.1);
    }
    .callout-cyan {
      border: 1px solid rgba(34, 211, 238, 0.3);
      background: rgba(34, 211, 238, 0.1);
      padding: 1.25rem;
      margin-top: 0;
      margin-bottom: 1.5rem;
    }
    .callout-teal {
      border: 1px solid rgba(45, 212, 191, 0.3);
      background: rgba(45, 212, 191, 0.1);
      padding: 1.25rem;
      margin-top: 0;
      margin-bottom: 1.5rem;
    }

    /* Lists */
    .bullets { display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.875rem; color: #cbd5e1; line-height: 1.625; }
    .bullets li { display: flex; gap: 0.5rem; }
    .bullet-arrow { color: #fb923c; margin-top: 0.125rem; }
    .check-arrow { color: #34d399; }

    /* Budget Bar & Accordion */
    .stack-bar {
      display: flex;
      height: 2.5rem;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 0.5rem;
    }
    .stack-seg {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.8);
    }
    .acc-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .acc-item {
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      overflow: hidden;
    }
    .acc-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      text-align: left;
    }
    .acc-btn:hover { background: rgba(255, 255, 255, 0.05); }
    .acc-dot { width: 0.75rem; height: 0.75rem; border-radius: 0.125rem; flex-shrink: 0; }
    .acc-name { font-weight: 600; flex: 1; }
    .acc-prio { display: none; font-size: 0.75rem; color: #94a3b8; }
    @media (min-width: 640px) { .acc-prio { display: inline; } }
    .acc-lines { font-size: 0.875rem; width: 5rem; text-align: right; }
    .acc-caret { color: #64748b; font-size: 0.75rem; }
    .acc-body { border-top: 1px solid rgba(255, 255, 255, 0.1); overflow-x: auto; }
    .acc-body[hidden] { display: none; }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .mod-row { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .mod-row:last-child { border-bottom: 0; }
    .mod-path { padding: 0.5rem 1rem; font-size: 0.75rem; color: #fdba74; white-space: nowrap; }
    .mod-lines { padding: 0.5rem; text-align: right; font-size: 0.75rem; white-space: nowrap; }
    .mod-note { padding: 0.5rem 1rem; font-size: 0.875rem; color: #94a3b8; min-width: 16rem; }
    .mod-bar-cell { padding: 0.5rem 1rem; width: 7rem; display: none; }
    @media (min-width: 768px) { .mod-bar-cell { display: table-cell; } }
    .mod-bar-bg { height: 0.375rem; border-radius: 0.25rem; background: rgba(255, 255, 255, 0.1); }
    .mod-bar-fg { height: 100%; border-radius: 0.25rem; }

    /* Code / Tree */
    .pre-box {
      font-size: 0.75rem;
      line-height: 1.625;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 1rem;
      overflow-x: auto;
      color: #cbd5e1;
    }
    .ol-steps {
      font-size: 0.875rem;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      list-style: decimal;
      padding-left: 1.25rem;
      line-height: 1.625;
    }

    /* Chips & Checklist */
    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip {
      font-size: 0.75rem;
      padding: 0.375rem 0.75rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .check-grid {
      display: grid;
      gap: 0.375rem 1.5rem;
      font-size: 0.875rem;
      color: #cbd5e1;
    }
    @media (min-width: 640px) { .check-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .check-label { display: flex; gap: 0.5rem; align-items: flex-start; cursor: pointer; }
    .check-label input { margin-top: 0.25rem; accent-color: #f97316; }

    /* World Spec & Biomes */
    .world-metrics {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.75rem 2rem;
    }
    .scale-compare { margin-top: 1.25rem; display: flex; align-items: flex-end; gap: 1.5rem; }
    .box-4km { width: 33px; height: 33px; background: rgba(100, 116, 139, 0.7); border: 1px solid rgba(255, 255, 255, 0.3); }
    .box-12km {
      width: 100px; height: 100px;
      background: rgba(34, 211, 238, 0.4);
      border: 1px solid #67e8f9;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }
    .box-12km > div { border: 1px solid rgba(165, 243, 252, 0.2); }
    .biome-strip {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      font-size: 0.75rem;
    }
    @media (min-width: 768px) { .biome-strip { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
    .biome-cell { padding: 1.25rem 0.5rem; color: rgba(0, 0, 0, 0.85); font-weight: 600; }

    /* Input Pipeline */
    .pipeline { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0.5rem; margin-bottom: 1.5rem; }
    .pipe-step { display: flex; align-items: center; gap: 0.5rem; flex: 1; min-width: 9rem; }
    .pipe-box {
      flex: 1; height: 100%;
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.75rem;
    }
    .tag-teal {
      font-size: 10px;
      padding: 0.125rem 0.5rem;
      border-radius: 0.25rem;
      background: rgba(45, 212, 191, 0.15);
      color: #5eead4;
    }

    /* Control Map Table */
    .ctrl-table { font-size: 0.75rem; }
    @media (min-width: 768px) { .ctrl-table { font-size: 0.875rem; } }
    .ctrl-table thead tr { background: rgba(255, 255, 255, 0.05); color: #94a3b8; text-align: left; }
    .ctrl-table th { padding: 0.625rem 0.75rem; font-weight: 500; }
    .ctrl-table td { padding: 0.5rem 0.75rem; border-top: 1px solid rgba(255, 255, 255, 0.05); }

    /* Perf Budget */
    .perf-item {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
    }

    /* Roadmap */
    .timeline {
      position: relative;
      padding-left: 1.5rem;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .tl-item { position: relative; }
    .tl-dot {
      position: absolute;
      left: -31px;
      top: 0.25rem;
      width: 1rem;
      height: 1rem;
      border-radius: 9999px;
      background: #f97316;
      border: 4px solid #0b0f17;
    }
    .tl-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.75rem; margin-bottom: 0.25rem; }
    .tl-prog-bg { height: 0.375rem; background: rgba(255, 255, 255, 0.1); border-radius: 0.25rem; margin-bottom: 1rem; }
    .tl-prog-fg { height: 100%; border-radius: 0.25rem; background: linear-gradient(to right, #fb923c, #f43f5e); }

    /* Workflow & Risks */
    .flow-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .flow-item {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem;
    }
    .risk-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .risk-card {
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem;
      display: grid;
      gap: 0.75rem;
      font-size: 0.875rem;
    }
    @media (min-width: 768px) { .risk-card { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    /* Text helpers */
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .text-slate-300 { color: #cbd5e1; }
    .text-slate-400 { color: #94a3b8; }
    .text-slate-500 { color: #64748b; }
    .text-orange-300 { color: #fdba74; }
    .text-orange-400 { color: #fb923c; }
    .text-cyan-200 { color: #a5f3fc; }
    .text-cyan-300 { color: #67e8f9; }
    .text-teal-300 { color: #5eead4; }
    .text-emerald-300 { color: #6ee7b7; }
    .text-emerald-400 { color: #34d399; }
    .text-rose-300 { color: #fda4af; }
    .text-rose-400 { color: #fb7185; }
    .leading-relaxed { line-height: 1.625; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .whitespace-nowrap { white-space: nowrap; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .mt-6 { margin-top: 1.5rem; }
    .mt-8 { margin-top: 2rem; }
    .mt-10 { margin-top: 2.5rem; }
    .mb-1-5 { margin-bottom: 0.375rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-5 { margin-bottom: 1.25rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .ml-auto { margin-left: auto; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-bar"></span>
        <span>HORIZON-STYLE RACER / 設計書</span>
      </div>
      <button id="downloadTop" class="btn-primary">Markdownで保存</button>
    </div>
    <nav id="mobileNav" class="mobile-nav"></nav>
  </header>

  <div class="container">
    <aside class="sidebar">
      <div id="sideNav" class="sidebar-sticky"></div>
    </aside>
    <main id="appMain"></main>
  </div>

  <script>
    const nav = [
      { id: "overview", label: "概要" },
      { id: "tech", label: "技術前提" },
      { id: "budget", label: "行数配分" },
      { id: "arch", label: "構成" },
      { id: "car", label: "車グラフィック" },
      { id: "course", label: "ワールド" },
      { id: "input", label: "操作方法" },
      { id: "perf", label: "性能予算" },
      { id: "roadmap", label: "ロードマップ" },
      { id: "flow", label: "制作手順" },
      { id: "risk", label: "リスク" },
    ];

    const groups = [
      {
        id: "car",
        name: "① 車グラフィック",
        color: "#f97316",
        priority: "最優先",
        modules: [
          { path: "car/spec/CarSpec.ts", lines: 1500, note: "型定義 + オリジナル車16台の寸法・外観・性能パラメータ表" },
          { path: "car/geometry/Loft.ts", lines: 1300, note: "断面ロフト、Catmull-Rom/B-spline、細分割、法線再計算、UV生成" },
          { path: "car/geometry/BodyBuilder.ts", lines: 2700, note: "ボンネット/ドア/ルーフ/フェンダー/バンパーをパネル単位で生成、パネルギャップ、ホイールアーチ" },
          { path: "car/geometry/GlassAndLamps.ts", lines: 1300, note: "窓ガラス、ヘッドライト(レンズ+リフレクタ+LED)、テールライト、ウィンカー" },
          { path: "car/geometry/Wheels.ts", lines: 2100, note: "リム(スポーク数/コンケーブ/リップ)、タイヤ断面、サイドウォール文字、ディスク/キャリパー" },
          { path: "car/geometry/Details.ts", lines: 1300, note: "グリル、ミラー、マフラー、スポイラー、ディフューザー、ナンバー、ワイパー" },
          { path: "car/geometry/Interior.ts", lines: 1700, note: "ダッシュボード、メーター、シート、ステアリング(コックピット視点用)" },
          { path: "car/materials/CarMaterials.ts", lines: 1800, note: "クリアコート塗装、メタリックフレーク、カーボン、ゴム、クローム、ガラス、シェーダ拡張" },
          { path: "car/materials/Livery.ts", lines: 700, note: "Canvasでビニール/デカール/レースナンバー生成、汚れ・濡れマスク" },
          { path: "car/Rig.ts", lines: 800, note: "サス連動、ステア、ボディロール/ピッチ、ブレーキ発光、ワイパー/ウィンカー動作" },
          { path: "car/Damage.ts", lines: 800, note: "衝突ダメージ(頂点変形・パーツ脱落・ガラス割れ・ヘコミ法線)、傷/泥/水滴の累積" },
        ],
      },
      {
        id: "course",
        name: "② コース・ワールド(12km四方の大型マップ)",
        color: "#22d3ee",
        priority: "第2優先(拡大)",
        modules: [
          { path: "world/Noise.ts", lines: 700, note: "シード付きノイズ(Simplex/FBM/Ridged/Domain Warp)。Worker内でも動く純関数" },

            ["総行数", fmt(totalLines), "最低ライン40,000行を超過"],
            ["車グラフィック", fmt(carLines), `${Math.round((carLines / totalLines) * 100)}% / 最優先`],
            ["ワールド", fmt(courseLines), `${Math.round((courseLines / totalLines) * 100)}% / 12km四方`],
            ["フェーズ", `${phases.length}`, "M0〜M9"],
          ].map(([k, v, s]) => `
            <div class="kpi-card">
              <div class="kpi-label">${esc(k)}</div>
              <div class="kpi-val">${esc(v)}</div>
              <div class="kpi-sub">${esc(s)}</div>
            </div>`).join("")}
        </div>

        <div class="callout callout-orange">
          <b class="text-orange-300">設計の核心:</b> 「車が一番目立つ」ため、先に <b>ショールームだけで完結する車ビューア</b> を作り、
          車の見栄え(形状→塗装→反射→ディテール)を完成させてからコースと物理を載せます。
          手続き生成の形状は破綻しやすいので、<b>最初の1台で品質を詰め → パラメータ化 → 16台に展開</b> します。
        </div>
      </section>

      <section id="tech" class="section">
        ${sectionHead("01", "技術前提・方針")}
        <div class="grid-2">
          ${techDecisions.map((t) => card(t.k, `<p class="text-sm text-slate-300 leading-relaxed">${esc(t.v)}</p>`)).join("")}
        </div>
        <p class="mt-4 text-sm text-slate-400">
          ※ 40,000行は「最低ライン」、本計画の目標は48,000行です(品質が上がるなら超過は歓迎、意味のない水増しはしません)。行数はTypeScriptの自作コード(データ表を含む)で数え、ライブラリ(Three.js)は含みません。
          最終成果物は1つのHTMLファイルになりますが、開発中は上限900行程度のモジュールに分割して管理します。
        </p>
      </section>

      <section id="budget" class="section">
        ${sectionHead("02", "行数配分(合計 48,000行 / 最低ライン 40,000行)")}
        <div class="stack-bar">
          ${groups.map((g) => {
            const pct = (groupTotal(g) / totalLines) * 100;
            return `<div class="stack-seg" title="${esc(g.name)} ${fmt(groupTotal(g))}" style="width:${pct}%;background:${g.color}">${pct > 8 ? Math.round(pct) + "%" : ""}</div>`;
          }).join("")}
        </div>
        <p class="text-xs text-slate-500 mb-6">グループをクリックするとファイル別の配分が開きます。</p>

        <div class="acc-list">
          ${groups.map((g) => {
            const isOpen = g.id === "car";
            return `
              <div class="acc-item" data-group="${g.id}">
                <button class="acc-btn" type="button" aria-expanded="${isOpen}">
                  <span class="acc-dot" style="background:${g.color}"></span>
                  <span class="acc-name">${esc(g.name)}</span>
                  <span class="acc-prio">${esc(g.priority)}</span>
                  <span class="mono acc-lines">${fmt(groupTotal(g))}</span>
                  <span class="acc-caret">${isOpen ? "▲" : "▼"}</span>
                </button>
                <div class="acc-body" ${isOpen ? "" : "hidden"}>
                  <table><tbody>
                    ${g.modules.map((m) => `
                      <tr class="mod-row">
                        <td class="mono mod-path">${esc(m.path)}</td>
                        <td class="mono mod-lines">${fmt(m.lines)}</td>
                        <td class="mod-note">${esc(m.note)}</td>
                        <td class="mod-bar-cell"><div class="mod-bar-bg"><div class="mod-bar-fg" style="width:${(m.lines / 2600) * 100}%;background:${g.color}"></div></div></td>
                      </tr>`).join("")}
                  </tbody></table>
                </div>
              </div>`;
          }).join("")}
        </div>
      </section>

      <section id="arch" class="section">
        ${sectionHead("03", "ファイル構成と1ファイル化")}
        <div class="grid-arch">
          <div class="col-span-3">
            <pre class="pre-box">${esc(fileTree)}</pre>
          </div>
          <div class="col-span-2" style="display:flex;flex-direction:column;gap:0.75rem">
            ${card("1ファイル化の流れ", `
              <ol class="ol-steps">
                <li>開発: <code class="text-orange-300">src/game/**</code> を分割編集</li>
                <li><code class="text-orange-300">npm run build</code> で動作確認</li>
                <li><code class="text-orange-300">node scripts/pack.mjs</code> が esbuild で全モジュールを結合</li>
                <li>JSを <code class="text-orange-300">&lt;script&gt;</code> へインライン化し、1枚のHTMLを出力</li>
                <li>行数を集計して予算と比較</li>
              </ol>`)}
            ${card("依存の向き(下→上のみ許可)", `
              <p class="text-sm text-slate-300 leading-relaxed">
                core → math/debug<br />
                car / world / physics → core<br />
                render → car, world<br />
                ai / ui / audio → physics, car, world<br />
                systems → 全体を統括
              </p>`)}
          </div>
        </div>
      </section>

      <section id="car" class="section">
        ${sectionHead("04", "車グラフィック設計(最優先)")}
        <div class="grid-2">
          ${carStages.map((s) => card(s.title, bullets(s.items), "#f97316")).join("")}
        </div>
        <h3 class="mt-8 mb-3 font-semibold">車種ラインナップ(すべてオリジナル設計・16台)</h3>
        <div class="chips">
          ${carLineup.map((c, i) => `
            <span class="chip"><span class="mono text-orange-400" style="margin-right:0.375rem">${String(i + 1).padStart(2, "0")}</span>${esc(c)}</span>`).join("")}
        </div>
        <div class="mt-6 card" style="background:rgba(255,255,255,0.03);padding:1rem">
          <h4 class="font-semibold mb-2 text-sm">車の品質チェックリスト(M1・M2の合格条件)</h4>
          <div class="check-grid">
            ${checklistItems.map((t) => `<label class="check-label"><input type="checkbox" /><span>${esc(t)}</span></label>`).join("")}
          </div>
        </div>
      </section>

      <section id="course" class="section">
        ${sectionHead("05", "コース・ワールド設計(第2優先 / 12km四方に拡大)")}
        <div class="callout callout-cyan">
          <div class="world-metrics">
            <div>
              <div class="text-xs" style="color:rgba(165,243,252,0.8)">ワールド面積</div>
              <div class="font-extrabold" style="font-size:1.875rem">144<span style="font-size:1rem;font-weight:700;margin-left:0.25rem">km²</span></div>
            </div>
            <div>
              <div class="text-xs" style="color:rgba(165,243,252,0.8)">道路総延長</div>
              <div class="font-extrabold" style="font-size:1.875rem">約250<span style="font-size:1rem;font-weight:700;margin-left:0.25rem">km</span></div>
            </div>
            <div>
              <div class="text-xs" style="color:rgba(165,243,252,0.8)">行数</div>
              <div class="font-extrabold" style="font-size:1.875rem">${fmt(courseLines)}<span style="font-size:1rem;font-weight:700;margin-left:0.25rem">行</span></div>
            </div>
            <div class="text-sm" style="color:rgba(207,250,254,0.8)">従来案(約4km四方 / 9,000行)から、面積9倍・行数 +3,000行</div>
          </div>
          <div class="scale-compare">
            <div class="text-center">
              <div class="box-4km"></div>
              <div class="mt-1 text-slate-400" style="font-size:10px">旧 4km</div>
            </div>
            <div class="text-center">
              <div class="box-12km">${"<div></div>".repeat(9)}</div>
              <div class="mt-1 text-cyan-200" style="font-size:10px">新 12km</div>
            </div>
          </div>
        </div>

        <div class="table-wrap mb-6">
          <table class="text-sm"><tbody>
            ${worldSpec.map((w) => `
              <tr class="mod-row">
                <td class="text-cyan-300 whitespace-nowrap font-semibold" style="padding:0.625rem 1rem;vertical-align:top">${esc(w.k)}</td>
                <td class="text-slate-300" style="padding:0.625rem 1rem">${esc(w.v)}</td>
              </tr>`).join("")}
          </tbody></table>
        </div>

        <div class="grid-2">
          ${courseStages.map((s) => card(s.title, bullets(s.items), "#22d3ee")).join("")}
        </div>
        <div class="biome-strip">
          ${biomes.map(([n, c, d]) => `
            <div class="biome-cell" style="background:${c}">
              <div class="text-sm">${esc(n)}</div>
              <div style="font-weight:400;opacity:0.8;margin-top:0.25rem">${esc(d)}</div>
            </div>`).join("")}
        </div>
      </section>

      <section id="input" class="section">
        ${sectionHead("06", "操作方法(キーボード / スマホ / Xbox / Switch Pro)")}
        <div class="callout callout-teal text-sm leading-relaxed">
          <b class="text-teal-300">4種類の操作デバイスに対応:</b> PCキーボード、スマホのタッチ(画面操作・傾き)、Xboxコントローラー、Nintendo Switch Proコントローラー。
          すべて共通の「アクション層」に集約するので、デバイスを途中で切り替えても同じ車が同じように動きます。
          入力まわりの配分は <b class="mono">${fmt(inputLines)}</b> 行(専用モジュール9本)です。
        </div>

        <div class="pipeline">
          ${inputPipeline.map((p, i) => `
            <div class="pipe-step">
              <div class="pipe-box">
                <div class="text-xs text-teal-300 font-bold">${esc(p.n)}</div>
                <div class="text-xs text-slate-400 mt-1 leading-relaxed">${esc(p.d)}</div>
              </div>
              ${i < inputPipeline.length - 1 ? `<span class="text-slate-500">→</span>` : ""}
            </div>`).join("")}
        </div>

        <div class="grid-2">
          ${inputDevices.map((d) => card("", `
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem">
              <h3 class="font-semibold" style="color:#fff">${esc(d.name)}</h3>
              <span class="mono tag-teal">${esc(d.tag)}</span>
            </div>
            ${bullets(d.items)}`, "#2dd4bf")).join("")}
        </div>

        <h3 class="mt-8 mb-3 font-semibold">既定の割当表</h3>
        <div class="table-wrap">
          <table class="ctrl-table">
            <thead>
              <tr>
                <th>操作</th>
                <th>キーボード</th>
                <th class="text-emerald-300">Xbox</th>
                <th class="text-rose-300">Switch Pro</th>
                <th class="text-teal-300">スマホ</th>
              </tr>
            </thead>
            <tbody>
              ${controlMap.map((c) => `
                <tr>
                  <td class="font-semibold whitespace-nowrap">${esc(c.a)}</td>
                  <td class="mono text-orange-300 whitespace-nowrap">${esc(c.kb)}</td>
                  <td class="text-slate-300 whitespace-nowrap">${esc(c.xbox)}</td>
                  <td class="text-slate-300 whitespace-nowrap">${esc(c.pro)}</td>
                  <td class="text-slate-300">${esc(c.touch)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <p class="text-xs text-slate-500 mt-3">
          ※ ボタンは「位置」基準で割当(下ボタンはXboxではA、Switch ProではB)。画面上の表示は接続中のコントローラーに合わせて自動で切り替えます。
          全割当はリマップ可能で、設定はlocalStorageに保存します。
        </p>
      </section>

      <section id="perf" class="section">
        ${sectionHead("07", "パフォーマンス予算")}
        <div class="grid-sm-2">
          ${perfBudget.map((p) => `
            <div class="perf-item">
              <span class="text-slate-300">${esc(p.k)}</span>
              <span class="mono text-orange-300 text-right">${esc(p.v)}</span>
            </div>`).join("")}
        </div>
      </section>

      <section id="roadmap" class="section">
        ${sectionHead("08", "ロードマップ(M0〜M9)")}
        <p class="text-sm text-slate-400 mb-5">フェーズ合計: <b class="mono" style="color:#fff">${fmt(phaseTotal)}</b> 行。各フェーズ末に必ずビルドと目視確認を行います。</p>
        <div class="timeline">${roadmapHtml}</div>
      </section>

      <section id="flow" class="section">
        ${sectionHead("09", "分割制作ワークフロー")}
        <ol class="flow-list">
          ${workflow.map((w, i) => `
            <li class="flow-item">
              <span class="mono text-orange-400 font-bold" style="font-size:1.125rem;line-height:1">${String(i + 1).padStart(2, "0")}</span>
              <span class="text-sm text-slate-300 leading-relaxed">${esc(w)}</span>
            </li>`).join("")}
        </ol>
        <div class="mt-6 card" style="background:rgba(255,255,255,0.03)">
          <h4 class="font-semibold mb-3 text-sm">次のセッションの指示例</h4>
          <pre class="pre-box" style="white-space:pre-wrap;border:0">${esc(nextPrompt)}</pre>
        </div>
      </section>

      <section id="risk" class="section">
        ${sectionHead("10", "リスクと対策")}
        <div class="risk-list">
          ${risks.map((r) => `
            <div class="risk-card">
              <div><span class="text-rose-400 font-semibold" style="margin-right:0.5rem">RISK</span>${esc(r.r)}</div>
              <div class="text-slate-300"><span class="text-emerald-400 font-semibold" style="margin-right:0.5rem">対策</span>${esc(r.c)}</div>
            </div>`).join("")}
        </div>
        <div class="mt-10 text-center">
          <button id="downloadBottom" class="btn-primary btn-lg">この設計書を Markdown でダウンロード</button>
          <p class="text-xs text-slate-500 mt-3">承認いただければ、次は M0(基盤とショールーム)から実装を開始します。</p>
        </div>
      </section>
    `;

    // Interactions
    document.getElementById("downloadTop").addEventListener("click", downloadMarkdown);
    document.getElementById("downloadBottom").addEventListener("click", downloadMarkdown);

    // Accordion
    document.querySelectorAll(".acc-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const item = btn.closest(".acc-item");
        const body = item.querySelector(".acc-body");
        const caret = btn.querySelector(".acc-caret");
        const willOpen = body.hasAttribute("hidden");

        document.querySelectorAll(".acc-item").forEach((other) => {
          other.querySelector(".acc-body").setAttribute("hidden", "");
          other.querySelector(".acc-btn").setAttribute("aria-expanded", "false");
          other.querySelector(".acc-caret").textContent = "▼";
        });

        if (willOpen) {
          body.removeAttribute("hidden");
          btn.setAttribute("aria-expanded", "true");
          caret.textContent = "▲";
        }
      });
    });

    // Active Nav Tracking
    const setActiveNav = (id) => {
      document.querySelectorAll("[data-nav]").forEach((el) => {
        el.classList.toggle("active", el.getAttribute("data-nav") === id);
      });
    };
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) setActiveNav(e.target.id);
        });
      },
      { rootMargin: "-30% 0px -60% 0px" }
    );
    nav.forEach((n) => {
      const el = document.getElementById(n.id);
      if (el) obs.observe(el);
    });
  </script>
</body>
</html>
